version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: kuno
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
